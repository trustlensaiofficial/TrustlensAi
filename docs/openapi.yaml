openapi: 3.1.0

# =============================================================================
# TrustLens AI — backend API contract
#
# This file is AUTHORITATIVE. The web, Android and iOS clients build against
# it, and the backend does not change a field without changing it here first.
#
# Two rules that shape every schema below:
#   1. No endpoint accepts a client-supplied owner id. Ownership is derived
#      from the authenticated session, server-side, always.
#   2. Every finding carries its provenance. A client must never compute,
#      infer or override a risk verdict.
# =============================================================================

info:
  title: TrustLens AI API
  version: 1.0.0
  description: |
    Financial scam investigation and response.

    **Authentication.** Supabase JWT in `Authorization: Bearer <token>`.
    Anonymous requests are permitted for `POST /analyses` and
    `GET /capabilities` so the product is usable without an account; every
    case endpoint requires a session.

    **Honesty constraints the contract enforces:**
    - `assessment.level` has no "safe" value. The most favourable outcome is
      `no_signals_detected`, which means our checks did not match — not that
      the content is genuine.
    - `uncertainty.notChecked` is required and may not be empty when a check
      was skipped.
    - `capabilities[].state` must name `unsupported_platform` where the OS
      offers no mechanism, so a client cannot imply a feature is merely off.

servers:
  - url: https://trustlensai-u2r6.vercel.app/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local

tags:
  - name: Analyses
    description: One-shot investigation of submitted content
  - name: Cases
    description: An investigation with linked evidence and a lifecycle
  - name: Recovery
    description: Action-aware incident response
  - name: Account
    description: History, export and deletion
  - name: System
    description: Capability reporting

paths:
  # ---------------------------------------------------------------- analyses
  /analyses:
    post:
      tags: [Analyses]
      summary: Investigate submitted content
      description: |
        Runs the full pipeline: deterministic rules, offline URL structure,
        optional live evidence, optional contextual model.

        `liveChecks` and `allowCloudAi` both default to **false**. Live
        network checks and any third-party model call require the client to
        opt in explicitly per request — there is no silent escalation.
      operationId: createAnalysis
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisRequest' }
      responses:
        '200':
          description: Investigation complete
          content:
            application/json:
              schema:
                type: object
                required: [report, requestId]
                properties:
                  report: { $ref: '#/components/schemas/Report' }
                  requestId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /analyses/{analysisId}:
    get:
      tags: [Analyses]
      summary: Retrieve a stored analysis
      operationId: getAnalysis
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: analysisId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { $ref: '#/components/schemas/Report' }
        '404':
          description: |
            Not found. **Byte-identical** to the response for a report owned by
            another user — the absence of a distinction is the access control.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------- cases
  /cases:
    post:
      tags: [Cases]
      summary: Open a scam case
      operationId: createCase
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                context: { $ref: '#/components/schemas/InputContext' }
                initialAnalysisId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: '#/components/schemas/Case' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      tags: [Cases]
      summary: List the caller's cases
      operationId: listCases
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CaseStatus' } }
      responses:
        '200':
          description: A page of cases
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items: { $ref: '#/components/schemas/Case' }
                  nextCursor: { type: string, nullable: true }

  /cases/{caseId}:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Cases]
      summary: Retrieve a case with its artifacts and findings
      operationId: getCase
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: '#/components/schemas/Case' }
                  artifacts:
                    type: array
                    items: { $ref: '#/components/schemas/Artifact' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Cases]
      summary: Update case status or title
      operationId: updateCase
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                status: { $ref: '#/components/schemas/CaseStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: '#/components/schemas/Case' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Cases]
      summary: Delete a case and everything derived from it
      description: |
        Deletion propagates to artifacts, analyses, findings, stored objects
        and derived records. It is not a soft flag.
      operationId: deleteCase
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /cases/{caseId}/artifacts:
    post:
      tags: [Cases]
      summary: Attach an evidence artifact
      operationId: addArtifact
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactInput' }
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact: { $ref: '#/components/schemas/Artifact' }

  /cases/{caseId}/events:
    post:
      tags: [Cases]
      summary: Record what the user actually did
      description: |
        This is what switches the product from warning to incident response.
        The **furthest** action recorded drives the recovery plan.
      operationId: addEvent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionState]
              properties:
                actionState: { $ref: '#/components/schemas/UserActionState' }
                occurredAt: { type: string, format: date-time }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Recorded; the recovery plan is regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryPlan: { $ref: '#/components/schemas/RecoveryPlan' }

  /recovery-plan:
    post:
      summary: What to do now, for someone who has already acted
      operationId: getRecoveryPlan
      description: |
        **Deliberately unauthenticated.** Someone whose money left their
        account ten minutes ago must not meet a sign-in screen. This endpoint
        reads nothing and stores nothing — it maps a caller-supplied action
        state onto fixed guidance.

        Rate limited at 30/minute rather than the usual 12, because a person
        working through a plan may legitimately re-request it several times.
      tags: [incident]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionState]
              properties:
                actionState: { $ref: '#/components/schemas/UserActionState' }
      responses:
        '200':
          description: The plan for that state. Every state has one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryPlan: { $ref: '#/components/schemas/RecoveryPlan' }
        '400':
          description: |
            Unrecognised state. The response body carries `validValues` with
            every accepted state, so a client author need not open this spec.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  validValues:
                    type: array
                    items: { $ref: '#/components/schemas/UserActionState' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      summary: The action states a client can offer, mildest first
      operationId: listActionStates
      tags: [incident]
      security: []
      responses:
        '200':
          description: Ordered by exposure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  actionStates:
                    type: array
                    items: { $ref: '#/components/schemas/UserActionState' }
                  note: { type: string }

  /cases/{caseId}/recovery-plan:
    get:
      tags: [Recovery]
      summary: The current recovery plan for this case
      operationId: getRecoveryPlan
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Plan for the furthest recorded action
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryPlan: { $ref: '#/components/schemas/RecoveryPlan' }

  /cases/{caseId}/reports:
    post:
      tags: [Cases]
      summary: Generate an evidence summary
      description: |
        Redaction **removes** content from the generated document. It is not a
        visual mask. The document states on its face that it is not a police
        report, a government certificate or a bank acknowledgement.
      operationId: createReport
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redact:
                  type: object
                  properties:
                    messageText: { type: boolean, default: false }
                    technicalEvidence: { type: boolean, default: false }
                    senderIdentifiers: { type: boolean, default: false }
                incidentAt: { type: string, format: date-time }
                actionsTaken: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId: { type: string, format: uuid }
                  downloadUrl:
                    type: string
                    description: Short-lived signed URL. Not a public object.
                  expiresAt: { type: string, format: date-time }

  # ----------------------------------------------------------------- account
  /account/history:
    get:
      tags: [Account]
      summary: The caller's own analysis history
      description: |
        Scoped to the authenticated session. There is deliberately **no**
        endpoint that lists another user's reports, and none that enumerates
        reports without a session.
      operationId: getHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: A page of history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryItem' }
                  nextCursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ system
  /capabilities:
    get:
      tags: [System]
      summary: What this deployment and client can actually do
      description: |
        Probed, not inferred from configuration. A provider that holds a valid
        key but refuses to serve reports as `unavailable` with the reason, not
        as `available`.
      operationId: getCapabilities
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: platform
          in: query
          schema: { type: string, enum: [web, android, ios] }
      responses:
        '200':
          description: Capability report
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A client-generated key. Retrying with the same key returns the original
        result instead of creating a duplicate record — necessary on mobile,
        where a dropped response is routine.
      schema: { type: string, maxLength: 128 }

  responses:
    BadRequest:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: No valid session
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found, or not the caller's
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: Payload exceeds the limit
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: A dependency is down; the reason is named
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error, requestId]
      properties:
        error: { type: string, description: Human-readable, safe to display }
        code: { type: string, description: Stable machine code }
        requestId: { type: string }
        retryable: { type: boolean }

    InputContext:
      type: string
      enum: [generic, bank_scam, job_offer, invoice, proposal, website, payment_request]

    AnalysisRequest:
      type: object
      properties:
        text: { type: string, maxLength: 8000 }
        url: { type: string, format: uri }
        qrPayload:
          type: string
          maxLength: 4000
          description: Decoded QR contents. Decoding happens on the client, on-device.
        context: { $ref: '#/components/schemas/InputContext' }
        liveChecks:
          type: boolean
          default: false
          description: Opt in to live DNS and page metadata retrieval.
        allowCloudAi:
          type: boolean
          default: false
          description: |
        allowCloudAI:
          type: boolean
          default: false
          deprecated: true
          description: |
            Accepted alias for `allowCloudAi`, kept because this route shipped
            with the capitalised spelling before the contract existed. Use
            `allowCloudAi` in new clients. If both are sent, either being true
            enables the layer.
            Opt in to a third-party model for this request only. False means
            no private content leaves the TrustLens backend.
        language: { type: string, enum: [en, ta, hi], default: en }
      anyOf:
        - { required: [text] }
        - { required: [url] }
        - { required: [qrPayload] }

    Provenance:
      type: string
      enum: [deterministic, on_device, retrieved, model_inference, user_supplied, assumption]
      description: |
        How a statement was established. Never blended. `assumption` exists so
        an unverified inference can be labelled rather than hidden.

    AssessmentLevel:
      type: string
      enum: [high_risk, elevated_risk, some_signals, no_signals_detected, unable_to_assess]
      description: |
        There is no "safe" value, by design. `no_signals_detected` means our
        checks did not match. `unable_to_assess` is used when evidence was
        insufficient — it is not a reassurance.

    Report:
      type: object
      required: [id, assessment, signals, findings, uncertainty, checklist, provenanceSummary]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        inputContext: { $ref: '#/components/schemas/InputContext' }
        inputPreview: { type: string, description: Truncated, display-safe echo }
        assessment:
          type: object
          required: [level, headline, summary]
          properties:
            level: { $ref: '#/components/schemas/AssessmentLevel' }
            headline: { type: string }
            summary: { type: string }
            signalScore:
              type: integer
              description: |
                Internal ranking aid only. **Not** a probability, and clients
                must not render it as a percentage.
        signals:
          type: array
          items: { $ref: '#/components/schemas/Signal' }
        findings:
          type: array
          items:
            type: object
            required: [statement, provenance]
            properties:
              statement: { type: string }
              provenance: { $ref: '#/components/schemas/Provenance' }
              evidenceIds: { type: array, items: { type: string } }
              confidence: { type: string, enum: [high, moderate, low] }
        paymentAction: { $ref: '#/components/schemas/PaymentAction' }
        uncertainty:
          type: object
          required: [checked, notChecked, limits]
          properties:
            checked: { type: array, items: { type: string } }
            notChecked:
              type: array
              items: { type: string }
              description: Required. A skipped check is never reported as passed.
            limits: { type: array, items: { type: string } }
        checklist:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              action: { type: string }
              why: { type: string }
        engine:
          type: object
          description: Which engine and ruleset produced this, for reproducibility.
          properties:
            detectionEngineVersion: { type: string }
            rulesetVersion: { type: string }
            rulesEvaluated: { type: integer }
        model:
          type: object
          properties:
            used: { type: boolean }
            provider: { type: string, enum: [vercel-ai-gateway, anthropic, none] }
            degraded: { type: boolean }
            reason: { type: string, nullable: true }
        provenanceSummary:
          type: object
          description: Count of findings by provenance, so a client can show the split.
          additionalProperties: { type: integer }

    Signal:
      type: object
      required: [id, title, severity, category, explanation, matches]
      properties:
        id: { type: string }
        title: { type: string }
        severity: { type: string, enum: [critical, high, medium, low] }
        category:
          type: string
          enum: [urgency, threat, impersonation, payment, credentials, domain, link, lure, secrecy, channel, claim]
        explanation: { type: string }
        matches:
          type: array
          description: The exact spans that fired the rule. This is the evidence.
          items:
            type: object
            required: [text, start, end]
            properties:
              text: { type: string }
              start: { type: integer }
              end: { type: integer }
              note: { type: string }

    PaymentAction:
      type: object
      description: |
        What the message is persuading the user to do with money. Parsing a
        `upi://` URI tells us the payee and amount; it does **not** establish
        that the beneficiary is genuine or that any money has moved.
      properties:
        detected: { type: boolean }
        kind:
          type: string
          enum: [send_money, approve_collect, enter_upi_pin, scan_qr, share_credentials, install_app, none]
        direction:
          type: string
          enum: [user_pays, user_receives, unclear]
          description: |
            For a UPI collect request this is `user_pays` even when the message
            claims a refund — that is the core deception.
        upi:
          type: object
          nullable: true
          properties:
            payeeVpa: { type: string }
            payeeName: { type: string }
            amount: { type: string }
            currency: { type: string }
            note: { type: string }
        explanation: { type: string }
        unknowns:
          type: array
          items: { type: string }
          description: Always includes that beneficiary legitimacy is unverified.

    CaseStatus:
      type: string
      enum: [draft, analysing, findings_available, needs_verification, user_acted, recovery_in_progress, reported, resolved, closed]

    Case:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/CaseStatus' }
        context: { $ref: '#/components/schemas/InputContext' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        furthestAction: { $ref: '#/components/schemas/UserActionState' }
        artifactCount: { type: integer }
        highestSeverity: { type: string, enum: [critical, high, medium, low, none] }

    ArtifactInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [message, url, screenshot, qr, email, sender_info, note] }
        text: { type: string, maxLength: 8000 }
        url: { type: string, format: uri }
        storageObjectPath:
          type: string
          description: Path in a private bucket. Ownership is validated server-side.
        senderLabel:
          type: string
          description: |
            As displayed by the messaging app. Recorded as `user_supplied` —
            a display name is never treated as identity.

    Artifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactInput'
        - type: object
          required: [id, createdAt, provenance]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            retrievedAt: { type: string, format: date-time, nullable: true }
            provider: { type: string, nullable: true }
            provenance: { $ref: '#/components/schemas/Provenance' }
            freshness:
              type: string
              enum: [live, cached, stale, unknown]
              description: A stale result is never presented as a live check.
            redacted: { type: boolean }
            relatedFindingIds: { type: array, items: { type: string } }

    UserActionState:
      type: string
      enum:
        - received_only
        - opened_link
        - entered_credentials
        - shared_otp_or_pin
        - installed_app
        - shared_screen
        - granted_remote_access
        - scanned_qr_only
        - entered_upi_pin
        - approved_payment_request
        - transferred_money
        - shared_identity_documents

    RecoveryPlan:
      type: object
      required: [actionState, urgency, steps]
      properties:
        actionState: { $ref: '#/components/schemas/UserActionState' }
        urgency: { type: string, enum: [immediate, prompt, routine] }
        title: { type: string }
        summary: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              order: { type: integer }
              action: { type: string }
              why: { type: string }
        officialChannels:
          type: array
          description: |
            India-specific and route-correct. Chakshu is for suspected
            fraudulent *communications*; 1930 and cybercrime.gov.in are for
            actual financial cybercrime. They are not interchangeable.
          items:
            type: object
            properties:
              name: { type: string }
              contact: { type: string }
              url: { type: string }
              useWhen: { type: string }
              urgent: { type: boolean }
        disclaimer:
          type: string
          description: States that recovery is not guaranteed and no report has been filed.

    HistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        level: { $ref: '#/components/schemas/AssessmentLevel' }
        headline: { type: string }
        preview: { type: string }
        caseId: { type: string, format: uuid, nullable: true }

    Capability:
      type: object
      required: [key, state]
      properties:
        key:
          type: string
          enum:
            - deterministic_rules
            - live_url_checks
            - cloud_ai
            - qr_parsing
            - account_sync
            - notification_monitoring
            - call_screening
            - sms_filtering
        state:
          type: string
          enum: [available, permission_required, unsupported_platform, degraded, paused, unavailable]
        reason:
          type: string
          nullable: true
          description: Required whenever state is not `available`.
        mechanism:
          type: string
          nullable: true
          description: |
            The exact platform API this rests on — `NotificationListenerService`,
            `ILMessageFilterExtension`, `CXCallDirectoryExtension` — or null
            where the platform provides none. Named so a claim can be checked
            against the OS documentation rather than taken on trust. A
            capability reported `available` always names one.
        limits:
          type: array
          items: { type: string }
          description: |
            What this specifically cannot see. Non-empty wherever the limit is
            the important part: that Android hands over notifications from
            every app and the app filter is ours, that iOS SMS filtering never
            sees iMessage or a saved contact, that call screening must answer
            in about five seconds and so runs no network lookup.
        lastCheckedAt: { type: string, format: date-time }
