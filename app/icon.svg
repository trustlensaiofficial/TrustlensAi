<!--
  TrustLens AI brandmark.

  IMPORTANT: this is a faithful SVG reproduction of the supplied TrustLens AI
  logo (shield + eye + globe + magnifier, cyan-to-violet gradient), drawn
  because the original raster asset could not be located on this machine.
  To use the official file instead, drop it in as public/logo-mark.png (or
  .svg) and point components/SiteHeader.tsx at it — nothing else depends on
  the internals of this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="TrustLens AI">
  <defs>
    <linearGradient id="tl-shield" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="tl-lens" x1="18" y1="16" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8F6FF"/>
      <stop offset="1" stop-color="#9DD6F5"/>
    </linearGradient>
    <radialGradient id="tl-globe" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#1565C0"/>
    </radialGradient>
    <clipPath id="tl-globe-clip"><circle cx="24" cy="24" r="5.1"/></clipPath>
  </defs>

  <!-- shield -->
  <path d="M24 3.6 38.9 9v12.3c0 9.1-6.2 16.4-14.9 19.6C15.3 37.7 9.1 30.4 9.1 21.3V9L24 3.6Z"
        fill="none" stroke="url(#tl-shield)" stroke-width="3.1"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- eye -->
  <path d="M12.6 24c3.3-4.9 7.1-7.3 11.4-7.3S32.1 19.1 35.4 24c-3.3 4.9-7.1 7.3-11.4 7.3S15.9 28.9 12.6 24Z"
        fill="none" stroke="url(#tl-lens)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- globe inside the eye -->
  <circle cx="24" cy="24" r="5.1" fill="url(#tl-globe)"/>
  <g clip-path="url(#tl-globe-clip)" fill="none" stroke="#BFE9FF" stroke-width=".85" opacity=".9">
    <ellipse cx="24" cy="24" rx="2.2" ry="5.1"/>
    <path d="M18.9 22.1h10.2M18.9 25.9h10.2"/>
  </g>
  <circle cx="24" cy="24" r="5.1" fill="none" stroke="#E8F6FF" stroke-width="1.05"/>

  <!-- magnifier handle -->
  <path d="M31.6 31.6 38 38" stroke="url(#tl-shield)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- pixel motes -->
  <g fill="url(#tl-shield)">
    <rect x="37.4" y="7.1" width="3.4" height="3.4" rx=".7"/>
    <rect x="41.9" y="11.4" width="2.6" height="2.6" rx=".6" opacity=".8"/>
    <rect x="37.9" y="13.9" width="2.2" height="2.2" rx=".5" opacity=".6"/>
  </g>
</svg>
