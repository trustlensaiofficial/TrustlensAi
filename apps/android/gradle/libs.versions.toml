# Pinned dependency versions for the TrustLens Android app.
#
# Every version here was read from the actual Maven repository metadata, not
# from the Maven Central search API — that API returns stale results and
# reported Kotlin's latest as 2.2.0 when the repository had 2.4.21.
#
# This started on AGP 8.13.2 and moved to 9.5.0 because CI said so, not on
# taste: core-ktx 1.19.1, Compose 1.12.1, lifecycle 2.11.0 and
# navigation 2.10.2 all refuse to resolve under AGP 8, each demanding
# "Android Gradle plugin 9.1.0 or higher" and compileSdk 37. AGP 9 is the
# mainstream now, so the cautious choice had become the broken one.
#
# compileSdk 37 with targetSdk 36 is intentional and Play-compliant: compiling
# against a newer SDK than you target is normal, and 36 is what Play requires.
#
# AGP 9 brings built-in Kotlin, so there is deliberately no kotlin-android
# plugin here — it is incompatible with AGP 9's new DSL.

[versions]
agp = "9.5.0"
# AGP 9.5 carries KGP 2.2.10 for built-in Kotlin. The Compose and
# serialization compiler plugins must match the Kotlin version AGP uses, so
# this tracks that rather than the newest Kotlin release.
kotlin = "2.2.10"

# Android SDK levels.
# targetSdk 36 is mandatory: since 31 August 2026 Google Play requires new apps
# and updates for phones, tablets and foldables to target Android 16 (API 36).
# Newest AndroidX requires compiling against 37. Targeting 36 satisfies Play.
compileSdk = "37"
targetSdk = "36"
# minSdk 26 (Android 8.0) keeps reach wide — which matters for this audience —
# without dragging in legacy workarounds. Every library below supports it.
minSdk = "26"

coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
datastore = "1.3.0"
securityCrypto = "1.1.0"
browser = "1.10.0"

camera = "1.6.2"
mlkitBarcode = "17.3.0"

retrofit = "3.0.0"
okhttp = "5.5.1"
kotlinxSerialization = "1.12.0"
coroutines = "1.11.0"

supabase = "3.9.0"
ktor = "3.6.1"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
mockk = "1.14.11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# The BOM aligns every Compose artifact, so none of them carry their own version.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android plugin: AGP 9 compiles Kotlin itself, and that plugin is
# incompatible with the new DSL. These two are separate compiler plugins and
# are still applied; their version must match the Kotlin that AGP uses.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
