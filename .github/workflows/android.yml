name: Android

# This workflow is the build. The machine the app was written on has no JDK,
# no Android SDK and no Gradle, so nothing here was compiled locally — a
# runner with the real toolchain is the only thing that can say whether this
# code builds, and its result is the only claim worth making about it.

on:
  push:
    branches: [main, "product/**", "feature/**", "fix/**", "chore/**"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  # So a build can be requested without pushing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # AGP 8.13.2 requires JDK 17 or newer.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Gradle wrapper JAR is deliberately not committed: it is a binary
      # that could not be generated on the authoring machine, and committing
      # one obtained from elsewhere is not a habit worth starting. The action
      # provides Gradle itself, at the version gradle-wrapper.properties pins,
      # so `gradle` is used here and `./gradlew` works for developers once
      # Android Studio generates the wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
        working-directory: .

      # Separate steps so a failure names the stage rather than "the build".
      - name: Compile
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload the APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trustlens-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/**
            apps/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
